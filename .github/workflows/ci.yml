name: CI

on:
  push:
    branches:
      - main
      - mvp-foundation
  pull_request:
    branches:
      - main
      - mvp-foundation

env:
  DATABASE_URL: postgresql://english_tutor:english_tutor@localhost:5432/english_tutor_app?schema=public
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: english_tutor
          POSTGRES_PASSWORD: english_tutor
          POSTGRES_DB: english_tutor_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_tutor -d english_tutor_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      E2E_PORT: "3000"
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: english_tutor
          POSTGRES_PASSWORD: english_tutor
          POSTGRES_DB: english_tutor_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_tutor -d english_tutor_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        run: npm run test:e2e
